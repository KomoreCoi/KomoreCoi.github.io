# Hexo 自动部署到 GitHub Pages（KomoreCoi.github.io）
#
# 架构：源码放在 source 分支，CI 构建后通过 peaceiris/actions-gh-pages 把 public 推送到 main 分支
#       （main 即 GitHub Pages 的发布源）。
#   - 不破坏现有 main 上的发布内容，由 CI 平滑接管部署。
#   - 仓库 Settings > Pages > Source 保持 “main 分支 / root” 即可，无需改成 GitHub Actions。
#
# 启用：把 source 分支推到 GitHub 后，Actions 会自动运行并部署；
#       之后停止本地 `hexo deploy`（会与 CI 互相覆盖），改动后 push source 即发布。
name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write   # peaceiris 需要用 GITHUB_TOKEN 推送到 main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate static site
        run: npx hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
